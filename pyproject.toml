[project]
name = "crucible"
version = "0.1.0"
description = "Crucible 融合检索层 —— llm_wiki 页面引擎 × LightRAG 实体图引擎的判别、召回与合并"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rag = ["lightrag-hku>=1.5.0", "sentence-transformers>=3.0"]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "mcp<2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
