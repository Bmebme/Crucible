<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" class="viz-root" role="img" aria-labelledby="t1 d1">
  <title id="t1">统一知识模型：三层视图与三类边</title>
  <desc id="d1">叙述层 wiki 页面以软边 wikilink 互链；实体层 L0~L4 实体以硬边显式声明关系；原文层提供不可变证据。实体与页面间由 kb_page 跨库边锚定，原文通过 source_documents 溯源到实体与页面。</desc>
  <style>
    .viz-root{color-scheme:light;--surf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--hair:#e1e0d9;--baseline:#c3c2b7;--border:rgba(11,11,11,.10);--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a}
    @media (prefers-color-scheme:dark){.viz-root{color-scheme:dark;--surf:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--hair:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,.10);--blue:#3987e5;--orange:#d95926;--aqua:#199e70}}
    .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
    .bx-orange{stroke:var(--orange);fill:var(--orange);fill-opacity:.10}
    .bx-blue{stroke:var(--blue);fill:var(--blue);fill-opacity:.10}
    .bx-gray{stroke:var(--baseline);fill:var(--hair);fill-opacity:.5}
    .ln{fill:none;stroke-width:1.5}
    .l-orange{stroke:var(--orange)} .l-blue{stroke:var(--blue)} .l-aqua{stroke:var(--aqua)} .l-gray{stroke:var(--baseline)}
    .mk-orange{fill:var(--orange)} .mk-blue{fill:var(--blue)} .mk-aqua{fill:var(--aqua)} .mk-gray{fill:var(--baseline)}
  </style>
  <marker id="mao" class="mk-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>
  <marker id="mab" class="mk-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>
  <marker id="maa" class="mk-aqua" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>
  <marker id="mag" class="mk-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>

  <rect width="1000" height="690" fill="var(--surf)"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="600" class="t1">统一知识模型：三层视图 · 三类边</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" class="t2">实体层回答「有什么 / 依赖谁」，叙述层回答「为什么 / 上下文」，原文层提供证据</text>

  <!-- 叙述层 -->
  <rect x="40" y="78" width="920" height="152" rx="10" class="bx-orange"/>
  <text x="60" y="104" font-size="15" font-weight="600" class="t1">叙述层 Narrative · wiki 页面（LLM Wiki）</text>
  <text x="940" y="104" text-anchor="end" font-size="12.5" class="t2">回答：为什么 / 上下文 / 来龙去脉</text>
  <rect x="70" y="136" width="190" height="48" rx="8" class="bx-orange"/>
  <text x="165" y="158" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">订单服务.md</text>
  <text x="165" y="175" text-anchor="middle" font-size="11" class="t2">叙事 · 溯源 · 可问答</text>
  <rect x="390" y="136" width="190" height="48" rx="8" class="bx-orange"/>
  <text x="485" y="158" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">支付方案对比.md</text>
  <text x="485" y="175" text-anchor="middle" font-size="11" class="t2">决策上下文</text>
  <rect x="710" y="136" width="190" height="48" rx="8" class="bx-orange"/>
  <text x="805" y="158" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">架构决策记录.md</text>
  <text x="805" y="175" text-anchor="middle" font-size="11" class="t2">ADR · 设计权衡</text>
  <line x1="260" y1="160" x2="388" y2="160" class="ln l-orange" stroke-dasharray="5 4" marker-end="url(#mao)"/>
  <text x="324" y="154" text-anchor="middle" font-size="11" class="t2">[[wikilink]]</text>
  <line x1="580" y1="160" x2="708" y2="160" class="ln l-orange" stroke-dasharray="5 4" marker-end="url(#mao)"/>
  <text x="644" y="154" text-anchor="middle" font-size="11" class="t2">[[wikilink]]</text>

  <!-- 实体层 -->
  <rect x="40" y="262" width="920" height="152" rx="10" class="bx-blue"/>
  <text x="60" y="288" font-size="15" font-weight="600" class="t1">实体层 Entity · L0~L4 结构化实体（HieraExtract）</text>
  <text x="940" y="288" text-anchor="end" font-size="12.5" class="t2">回答：有什么 / 依赖谁 / 影响多大</text>
  <rect x="70" y="320" width="190" height="48" rx="8" class="bx-blue"/>
  <text x="165" y="342" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">svc-订单服务</text>
  <text x="165" y="359" text-anchor="middle" font-size="11" class="t2">L3 · 契约 / 技术栈</text>
  <rect x="390" y="320" width="190" height="48" rx="8" class="bx-blue"/>
  <text x="485" y="342" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">svc-结算服务</text>
  <text x="485" y="359" text-anchor="middle" font-size="11" class="t2">L3 · 数据所有权</text>
  <rect x="710" y="320" width="190" height="48" rx="8" class="bx-blue"/>
  <text x="805" y="342" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">mq-Kafka</text>
  <text x="805" y="359" text-anchor="middle" font-size="11" class="t2">L4 · 基础设施组件</text>
  <line x1="260" y1="344" x2="388" y2="344" class="ln l-blue" marker-end="url(#mab)"/>
  <text x="324" y="338" text-anchor="middle" font-size="11" class="t2">depends_on</text>
  <line x1="580" y1="344" x2="708" y2="344" class="ln l-blue" marker-end="url(#mab)"/>
  <text x="644" y="338" text-anchor="middle" font-size="11" class="t2">contract</text>

  <!-- 跨库边 -->
  <line x1="165" y1="184" x2="165" y2="318" class="ln l-aqua" stroke-dasharray="5 4" marker-end="url(#maa)"/>
  <text x="105" y="252" font-size="11" class="t2">kb_page</text>
  <line x1="805" y1="184" x2="805" y2="318" class="ln l-aqua" stroke-dasharray="5 4" marker-end="url(#maa)"/>
  <text x="745" y="252" text-anchor="end" font-size="11" class="t2">kb_page</text>

  <!-- 原文层 -->
  <rect x="40" y="446" width="920" height="120" rx="10" class="bx-gray"/>
  <text x="60" y="472" font-size="15" font-weight="600" class="t1">原文层 Raw · 不可变源文档</text>
  <text x="940" y="472" text-anchor="end" font-size="12.5" class="t2">提供：证据（逐句可引）</text>
  <rect x="70" y="496" width="200" height="40" rx="8" class="bx-gray"/>
  <text x="170" y="520" text-anchor="middle" font-size="12.5" class="t1">docs/api-spec.pdf</text>
  <rect x="290" y="496" width="200" height="40" rx="8" class="bx-gray"/>
  <text x="390" y="520" text-anchor="middle" font-size="12.5" class="t1">docs/architecture.md</text>
  <rect x="510" y="496" width="200" height="40" rx="8" class="bx-gray"/>
  <text x="610" y="520" text-anchor="middle" font-size="12.5" class="t1">web-clip-支付方案.html</text>
  <rect x="730" y="496" width="200" height="40" rx="8" class="bx-gray"/>
  <text x="830" y="520" text-anchor="middle" font-size="12.5" class="t1">deploy-topology.pdf</text>

  <!-- 溯源边 -->
  <line x1="170" y1="496" x2="165" y2="370" class="ln l-gray" stroke-dasharray="2 3" marker-end="url(#mag)"/>
  <text x="105" y="434" font-size="11" class="t2">source_documents</text>
  <line x1="390" y1="496" x2="485" y2="370" class="ln l-gray" stroke-dasharray="2 3" marker-end="url(#mag)"/>
  <text x="330" y="434" font-size="11" class="t2">source_documents</text>

  <!-- 图例 -->
  <rect x="40" y="602" width="920" height="64" rx="10" class="bx-gray"/>
  <line x1="60" y1="630" x2="140" y2="630" class="ln l-blue"/>
  <text x="150" y="635" font-size="12.5" class="t2">硬边（entity_relations）</text>
  <text x="150" y="654" font-size="11.5" class="tm">精确推导 · 影响面</text>
  <line x1="380" y1="630" x2="460" y2="630" class="ln l-orange" stroke-dasharray="5 4"/>
  <text x="470" y="635" font-size="12.5" class="t2">软边（wikilink + 四信号）</text>
  <text x="470" y="654" font-size="11.5" class="tm">语义关联 · 社区发现</text>
  <line x1="690" y1="630" x2="770" y2="630" class="ln l-aqua" stroke-dasharray="5 4"/>
  <text x="780" y="635" font-size="12.5" class="t2">跨库边（kb_page_map）</text>
  <text x="780" y="654" font-size="11.5" class="tm">实体 ↔ 页面锚点</text>
</svg>
