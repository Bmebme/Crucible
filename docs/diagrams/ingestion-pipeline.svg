<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" class="viz-root" role="img" aria-labelledby="t1 d1">
  <title id="t1">生成管道：双引擎写入与事件联动</title>
  <desc id="d1">文档到达后分叉进入两条管道：HieraExtract 提取 L0~L4 实体并幂等写库，LLM Wiki 两步思维链生成 wiki 页面；两者各自发出事件进入事件总线，触发融合层的图重建、实体页物化与对齐；物化与对齐结果反向回写对端。</desc>
  <style>
    .viz-root{color-scheme:light;--surf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--hair:#e1e0d9;--baseline:#c3c2b7;--border:rgba(11,11,11,.10);--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--violet:#4a3aa7}
    @media (prefers-color-scheme:dark){.viz-root{color-scheme:dark;--surf:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--hair:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,.10);--blue:#3987e5;--orange:#d95926;--aqua:#199e70;--violet:#9085e9}}
    .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
    .bx-blue{stroke:var(--blue);fill:var(--blue);fill-opacity:.10}
    .bx-orange{stroke:var(--orange);fill:var(--orange);fill-opacity:.10}
    .bx-aqua{stroke:var(--aqua);fill:var(--aqua);fill-opacity:.10}
    .bx-violet{stroke:var(--violet);fill:var(--violet);fill-opacity:.10}
    .bx-gray{stroke:var(--baseline);fill:var(--hair);fill-opacity:.5}
    .ln{fill:none;stroke-width:1.5}
    .l-blue{stroke:var(--blue)} .l-orange{stroke:var(--orange)} .l-aqua{stroke:var(--aqua)}
    .mk-blue{fill:var(--blue)} .mk-orange{fill:var(--orange)} .mk-aqua{fill:var(--aqua)}
  </style>
  <marker id="mab" class="mk-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>
  <marker id="mao" class="mk-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>
  <marker id="maa" class="mk-aqua" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z"/></marker>

  <rect width="1000" height="560" fill="var(--surf)"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="600" class="t1">生成管道：双引擎写入 · 事件联动</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" class="t2">任一引擎写入后发出事件，融合层增量更新，并反向触发对端生成</text>

  <!-- 文档到达 -->
  <rect x="400" y="80" width="200" height="48" rx="8" class="bx-gray"/>
  <text x="500" y="101" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">文档到达</text>
  <text x="500" y="118" text-anchor="middle" font-size="11" class="t2">新文档 / 剪藏 / 文件夹监听</text>
  <line x1="440" y1="128" x2="262" y2="160" class="ln l-blue" marker-end="url(#mab)"/>
  <text x="405" y="142" text-anchor="end" font-size="10.5" class="t2">文档</text>
  <line x1="560" y1="128" x2="738" y2="160" class="ln l-orange" marker-end="url(#mao)"/>
  <text x="595" y="142" font-size="10.5" class="t2">文档</text>

  <!-- 管道 A -->
  <text x="260" y="152" text-anchor="middle" font-size="11.5" class="t2">管道 A · 结构化引擎</text>
  <rect x="140" y="164" width="240" height="46" rx="8" class="bx-blue"/>
  <text x="260" y="192" text-anchor="middle" font-size="13" font-weight="600" class="t1">① hieraextract run &lt;doc&gt;</text>
  <rect x="140" y="228" width="240" height="46" rx="8" class="bx-blue"/>
  <text x="260" y="256" text-anchor="middle" font-size="13" class="t2">② L0~L4 提取 → 幂等 upsert</text>
  <rect x="140" y="292" width="240" height="46" rx="8" class="bx-blue"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" class="t2">③ 事件 A：kb_updated</text>
  <line x1="260" y1="210" x2="260" y2="226" class="ln l-blue" marker-end="url(#mab)"/>
  <line x1="260" y1="274" x2="260" y2="290" class="ln l-blue" marker-end="url(#mab)"/>

  <!-- 管道 B -->
  <text x="740" y="152" text-anchor="middle" font-size="11.5" class="t2">管道 B · 叙述引擎</text>
  <rect x="620" y="164" width="240" height="46" rx="8" class="bx-orange"/>
  <text x="740" y="192" text-anchor="middle" font-size="13" font-weight="600" class="t1">① llm_wiki Ingest &lt;doc&gt;</text>
  <rect x="620" y="228" width="240" height="46" rx="8" class="bx-orange"/>
  <text x="740" y="256" text-anchor="middle" font-size="13" class="t2">② 两步思维链 → wiki 页面</text>
  <rect x="620" y="292" width="240" height="46" rx="8" class="bx-orange"/>
  <text x="740" y="320" text-anchor="middle" font-size="13" class="t2">③ 事件 B：wiki_updated</text>
  <line x1="740" y1="210" x2="740" y2="226" class="ln l-orange" marker-end="url(#mao)"/>
  <line x1="740" y1="274" x2="740" y2="290" class="ln l-orange" marker-end="url(#mao)"/>

  <!-- 事件总线 -->
  <rect x="420" y="236" width="160" height="60" rx="8" class="bx-violet"/>
  <text x="500" y="262" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">事件总线</text>
  <text x="500" y="281" text-anchor="middle" font-size="11" class="t2">SQLite 事件表</text>
  <line x1="380" y1="315" x2="418" y2="315" class="ln l-blue" marker-end="url(#mab)"/>
  <line x1="620" y1="315" x2="582" y2="315" class="ln l-orange" marker-end="url(#mao)"/>

  <!-- 融合动作 -->
  <rect x="60" y="420" width="270" height="70" rx="8" class="bx-aqua"/>
  <text x="195" y="448" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">重建融合图边</text>
  <text x="195" y="468" text-anchor="middle" font-size="11" class="t2">fusion_graph 增量重建</text>
  <rect x="365" y="420" width="270" height="70" rx="8" class="bx-aqua"/>
  <text x="500" y="448" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">实体页物化器</text>
  <text x="500" y="468" text-anchor="middle" font-size="11" class="t2">新实体 → 实体页 + log.md（写 wiki）</text>
  <rect x="670" y="420" width="270" height="70" rx="8" class="bx-aqua"/>
  <text x="805" y="448" text-anchor="middle" font-size="13.5" font-weight="600" class="t1">对齐器</text>
  <text x="805" y="468" text-anchor="middle" font-size="11" class="t2">新页面 → LLM 对齐 kb_page_map</text>
  <line x1="470" y1="296" x2="197" y2="418" class="ln l-aqua" marker-end="url(#maa)"/>
  <line x1="500" y1="296" x2="500" y2="418" class="ln l-aqua" marker-end="url(#maa)"/>
  <line x1="530" y1="296" x2="803" y2="418" class="ln l-aqua" marker-end="url(#maa)"/>

  <!-- 对端回写 -->
  <line x1="635" y1="420" x2="635" y2="372" class="ln l-orange" stroke-dasharray="5 4"/>
  <line x1="635" y1="372" x2="740" y2="372" class="ln l-orange" stroke-dasharray="5 4"/>
  <line x1="740" y1="372" x2="740" y2="340" class="ln l-orange" stroke-dasharray="5 4" marker-end="url(#mao)"/>
  <text x="655" y="364" font-size="11" class="t2">写实体页</text>
  <line x1="670" y1="420" x2="670" y2="384" class="ln l-blue" stroke-dasharray="5 4"/>
  <line x1="670" y1="384" x2="260" y2="384" class="ln l-blue" stroke-dasharray="5 4"/>
  <line x1="260" y1="384" x2="260" y2="340" class="ln l-blue" stroke-dasharray="5 4" marker-end="url(#mab)"/>
  <text x="430" y="376" text-anchor="middle" font-size="11" class="t2">对齐结果回写 KB</text>

  <text x="500" y="522" text-anchor="middle" font-size="11.5" class="tm">实线：事件流 · 虚线：对端回写（物化 / 对齐） · 融合层可整体幂等重建</text>
</svg>
