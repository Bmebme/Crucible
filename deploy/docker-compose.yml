# Crucible 工程化栈 (docs/engineering-plan.md)
# 服务: crucible(融合) + postgres(元数据) + docreader(MinerU/markitdown 文档解析)
# llm-wiki 为宿主机 19828 (容器内经 host.docker.internal 访问);
# lightrag 当前进程内 (demo), 内网版上线后独立容器同契约替换
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: ${PG_PASSWORD:-crucible}
      POSTGRES_DB: crucible
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible"]
      interval: 5s
      timeout: 3s
      retries: 12

  crucible:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      # docker 内访问宿主机: llm-wiki daemon (本地 19828) 与 PG
      CRUCIBLE_WIKI_BASE: http://host.docker.internal:19828
      CRUCIBLE_DATABASE_URL: postgresql+asyncpg://crucible:${PG_PASSWORD:-crucible}@postgres:5432/crucible
      # docreader 服务 (P3)
      CRUCIBLE_DOCREADER_BASE: http://docreader:8081
    ports:
      - "8080:8080"
    volumes:
      # 宿主机模型缓存直接绑入 (避免容器内重下 bge 模型/tiktoken, 网络受限环境)
      - ${HF_CACHE_HOST:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TIKTOKEN_CACHE_HOST:-~/.cache/tiktoken}:/root/.cache/tiktoken
      - ${DATA_ROOT:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy

  docreader:
    # 模型已烧入镜像 (docker commit 自实测通过的容器), Dockerfile 配方见
    # deploy/Dockerfile.docreader (torch 走 tuna / 模型 HF 镜像源)
    image: deploy-docreader:with-models
    environment:
      MINERU_MODEL_SOURCE: huggingface
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_OFFLINE: "1"   # 模型已烧入镜像缓存, 关闭在线探测
    ports:
      - "8081:8081"
    # 实测: 4g 会被 OOM 杀 (torch CUDA + MinerU 管线峰值 ~5g), 给 6g
    mem_limit: 6g

volumes:
  pg-data:
  mineru-models:
