# Crucible 工程化栈 (docs/engineering-plan.md)
# 服务: crucible(融合) + postgres(元数据) + docreader(MinerU/markitdown 文档解析)
# llm-wiki 为宿主机 19828 (容器内经 host.docker.internal 访问);
# lightrag 当前进程内 (demo), 内网版上线后独立容器同契约替换
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: ${PG_PASSWORD:-crucible}
      POSTGRES_DB: crucible
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible"]
      interval: 5s
      timeout: 3s
      retries: 12

  crucible:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      # 默认容器内 llm-wiki 服务; 用宿主机 daemon 时 .env 设
      # CRUCIBLE_WIKI_BASE=http://host.docker.internal:19828
      CRUCIBLE_WIKI_BASE: ${CRUCIBLE_WIKI_BASE:-http://llm-wiki:19828}
      CRUCIBLE_DATABASE_URL: postgresql+asyncpg://crucible:${PG_PASSWORD:-crucible}@postgres:5432/crucible
      # docreader 服务 (P3)
      CRUCIBLE_DOCREADER_BASE: http://docreader:8081
    ports:
      - "8080:8080"
    volumes:
      # 宿主机模型缓存直接绑入 (避免容器内重下 bge 模型/tiktoken, 网络受限环境)
      - ${HF_CACHE_HOST:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TIKTOKEN_CACHE_HOST:-~/.cache/tiktoken}:/root/.cache/tiktoken
      - ${DATA_ROOT:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy

  docreader:
    # 默认: 轻量 markitdown 版 (构建快, 一键路径)
    # 完整 MinerU: 设 DOCREADER_FULL_IMAGE=deploy-docreader:with-models
    # (镜像经 docs/deploy.md §3.3 工作流本地生成), 则跳过构建直接用烧好模型的镜像
    image: ${DOCREADER_FULL_IMAGE:-deploy-docreader-light}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docreader-light
    environment:
      MINERU_MODEL_SOURCE: huggingface
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - "8081:8081"

  # 页面知识库后端 (py-llm-wiki daemon 容器化, 需与 crucible 同级 clone:
  # git clone https://github.com/Bmebme/py-llm-wiki.git, bootstrap.sh 自动处理)
  llm-wiki:
    build:
      context: ../py-llm-wiki
    env_file: .env
    environment:
      PY_LLM_WIKI_DATA_DIR: /data
      LLM_WIKI_LLM_BASE: ${LLM_WIKI_LLM_BASE:-}
      LLM_WIKI_LLM_API_KEY: ${LLM_WIKI_LLM_API_KEY:-}
      LLM_WIKI_LLM_MODEL: ${LLM_WIKI_LLM_MODEL:-}
    ports:
      - "19828:19828"
    volumes:
      - llm-wiki-data:/data
      - ${DATA_ROOT:-./data}:/projects
    profiles: ["full"]   # 本机有宿主机 daemon 时默认不启用, --profile full 切换

volumes:
  pg-data:
  mineru-models:
  llm-wiki-data:
